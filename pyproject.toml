[project]
name = "arda-servo"
version = "0.1.0"
description = "ARDA Servo — 레이더 좌표 기반 Jetson 팬(pan) 서보 제어"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "Jetson.GPIO>=2.1.0; platform_machine == 'aarch64'",
]

[project.scripts]
arda-servo = "main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
