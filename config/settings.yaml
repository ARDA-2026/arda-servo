udp:
  host: "0.0.0.0"
  port: 9999
  timeout: 0.5      # 초 — recv() 논블로킹 폴링 주기

servo:
  gpio_pin: 33          # Jetson 40핀 헤더 물리 핀 번호 (BOARD 모드, PWM 지원 핀)
  min_deg: 0.0
  max_deg: 180.0
  center_deg: 90.0      # 레이더 정면(azimuth=0)에 대응하는 서보 각도
  invert: false          # 배선/장착 방향에 따라 좌우가 반대로 움직이면 true로 변경
  stale_timeout: 2.0    # 초 — 이 시간 이상 좌표 미수신 시 경고 로그(각도는 마지막 값 유지)

# 서보가 레이더 대비 설치된 위치 차이 (m, 레이더 좌표계 기준)
# 예: 서보가 레이더보다 오른쪽 0.2m, 앞쪽 0.1m, 아래쪽 0.3m에 설치됐다면
# x: 0.2, y: 0.1, z: -0.3. 같은 위치에 있으면 0으로 둔다.
#
# 주의: z(상하 오프셋)는 현재 팬(pan) 1축 각도 계산에는 반영되지 않는다.
# 좌우로만 회전하는 팬 각도는 수평(x,y) 차이로만 정해지고 높이 차이의
# 영향을 받지 않기 때문이다(카메라를 아래로 고정 기울여 달아도 마찬가지).
# 시작 시 로그로만 확인되며, 나중에 tilt 축을 추가하면 그 elevation 계산에
# 사용한다.
mount_offset:
  x: 0.0
  y: 0.0
  z: 1.0
